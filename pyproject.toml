[project]
name = "clinfail"
version = "1.0.0"
description = "Two clinical failure modes of MedGemma-27B and the code to reproduce them."
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "matplotlib",
    "numpy",
    "openai>=1.40",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinfail"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
